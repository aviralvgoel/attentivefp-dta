[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attentivefp-dta-project"
version = "1.0.0"
description = "PCBA pretraining and controlled AttentiveFP transfer to drug-target affinity"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4", "torch-geometric>=2.6,<3", "numpy>=1.26,<3",
  "pandas>=2.1,<3", "pyarrow>=15", "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2", "rdkit>=2023.9", "PyYAML>=6", "tqdm>=4.66",
]

[project.optional-dependencies]
esm = ["transformers>=4.45,<5", "safetensors>=0.4"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

